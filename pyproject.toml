[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku-env"
version = "0.1.0"
description = "Gomoku game logic, Gymnasium environment, and AlphaZero-style self-play training for RL"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "torch>=2.2",
]

[tool.setuptools]
packages = ["gomoku_env", "alphazero"]
